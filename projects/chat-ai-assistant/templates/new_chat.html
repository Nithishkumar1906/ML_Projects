<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .user {
            text-align: right;
            color: blue;
            margin-bottom: 10px;
        }
        .ai {
            text-align: left;
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">💬 Chat with Your PDF</h2>

    <div class="chat-box">
        {% for role, message in chat_history %}
            <div class="{{ 'user' if role == 'User' else 'ai' }}">
                <strong>{{ role }}:</strong> {{ message | safe }}
            </div>
        {% endfor %}
    </div>

    <form method="POST">
        <div class="input-group mb-3">
            <input type="text" name="user_question" class="form-control" placeholder="Ask something..." required>
            <button class="btn btn-success" type="submit">Send</button>
        </div>
    </form>

    <a href="/" class="btn btn-secondary">⬅️ Back to Home</a>
</div>
</body>
</html>
