<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Essay Grading</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">📝 Essay Grading</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="file" class="form-label">Upload Essay PDF (optional)</label>
            <input type="file" class="form-control" name="file" accept=".pdf">
        </div>
        <div class="mb-3">
            <label for="essay_text" class="form-label">Or Paste Essay Text</label>
            <textarea class="form-control" name="essay_text" rows="8" placeholder="Paste your essay here...">{{ input_text if input_text else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Grade Essay</button>
    </form>

    {% if result %}
        <hr>
        <h4>🔍 Grading Result</h4>
        <div class="alert alert-info mt-3">{{ result|safe }}</div>
    {% endif %}

    <a href="/" class="btn btn-secondary mt-3">⬅️ Back to Home</a>
</div>
</body>
</html>
