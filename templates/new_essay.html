<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Essay Rubric</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">🧾 Enter Essay Grading Rubric</h2>
    <form method="POST" action="/essay_grading">
        <div class="mb-3">
            <textarea class="form-control" name="essay_rubric" rows="10" placeholder="Enter your rubric here..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Proceed to Essay Grading</button>
    </form>
</div>
</body>
</html>
